<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i forgot again</title>
<meta name="description" content="A tiny notebook for the stupid-simple facts I keep forgetting. Ask, and it answers — from facts.js, or from a small model running in the browser.">
<meta name="theme-color" content="#0b0c0e">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<!-- start fetching the model runtime early, before the first question -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://huggingface.co" crossorigin>
<link rel="dns-prefetch" href="https://cdn-lfs.huggingface.co">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/+esm" crossorigin>
</head>
<body>

<main class="shell">

  <header class="masthead">
    <h1 class="wordmark"><a href="./">i forgot again</a></h1>
    <p class="tagline">things I already knew and lost</p>
  </header>

  <form class="ask" id="ask" role="search" autocomplete="off">
    <label class="vh" for="q">What did you forget?</label>
    <span class="caret" aria-hidden="true">&gt;</span>
    <input
      id="q"
      name="q"
      type="text"
      placeholder="type what you forgot…"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      spellcheck="false"
      enterkeyhint="search">
    <button class="vh" type="submit">Ask</button>
  </form>

  <section class="result" id="result" aria-live="polite"></section>

</main>

<footer class="footer">
  <p>Ask a question. If you've written it down in <code>facts.js</code>, you get that answer. Otherwise a small language model runs in this tab on WebGPU and answers. Nothing you type leaves the browser.</p>
</footer>

<script src="facts.js"></script>
<script src="app.js"></script>
</body>
</html>
